name: Worker

# Processa a fila de investigações sem depender de computador pessoal ligado.
# Também mantém o banco do plano gratuito ativo (o Supabase pausa projetos parados por 1 semana).
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "Máximo de jobs nesta execução"
        default: "5"

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Repositório público: logs do Actions são visíveis. O worker só imprime contagens e erros técnicos.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'gemini-3.8-flash' }}
      AI_PRICING_JSON: ${{ vars.AI_PRICING_JSON }}
      WORKER_MAX_JOBS: ${{ inputs.max_jobs || '5' }}
    steps:
      - name: Verificar configuração
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Secret DATABASE_URL não configurado; nada a fazer."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.cfg.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Aplicar migrations pendentes
        if: steps.cfg.outputs.ready == 'true'
        run: pnpm db:migrate
      - name: Processar fila
        if: steps.cfg.outputs.ready == 'true'
        run: pnpm worker
